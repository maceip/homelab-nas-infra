# BEGIN homelab-nas managed Radxa Penta SATA HAT
# Enable the external Raspberry Pi 5 PCIe connector.
dtparam=pciex1
# PCIe Gen 3.0 (8 GT/s). Raspberry Pi 5 is not certified for Gen 3.0;
# the default is Gen 2.0. See Raspberry Pi PCIe documentation.
dtparam=pciex1_gen=3
# Required for the JMicron JMB585 on current Raspberry Pi OS kernels.
dtoverlay=pcie-32bit-dma-pi5
# END homelab-nas managed Radxa Penta SATA HAT
