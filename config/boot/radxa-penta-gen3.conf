# BEGIN homelab-nas managed Radxa Penta SATA HAT
# Enable the external Raspberry Pi 5 PCIe connector.
dtparam=pciex1
# Owner-selected maximum-throughput mode. Raspberry Pi does not certify Gen 3.
dtparam=pciex1_gen=3
# Required by current kernels for the JMB585 SATA controller on Raspberry Pi 5.
dtoverlay=pcie-32bit-dma-pi5
# END homelab-nas managed Radxa Penta SATA HAT

