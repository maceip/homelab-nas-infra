[global]
   workgroup = WORKGROUP
   server string = homelab-nas
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nas-share

   min protocol = SMB2_10
   max protocol = SMB3
   server multi channel support = yes
   use sendfile = yes
   aio read size = 1
   aio write size = 1

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   ea support = yes
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes

   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

[Public]
   path = /srv/storage/public
   browseable = yes
   read only = no
   guest ok = yes
   force user = nas-share
   force group = nas-share
   create mask = 0666
   directory mask = 0777
   force create mode = 0666
   force directory mode = 0777
